[project]
name = "fte-siret3"
version = "0.1.0"
description = "Sireț3: fine-tuning on external open datasets (per-plant canopy split, waste, interrow cover)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "vineyard-siret3[nn,waste-ml]",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "segmentation-models-pytorch==0.5.0",
    "opencv-python-headless==4.14.0.94",
    "numpy>=2.1",
    "shapely==2.1.2",
    "geopandas==1.1.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fte"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]
override-dependencies = ["networkx>=3.0"]

[tool.uv.sources]
vineyard-siret3 = { path = "../AI", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: longer-running integration tests",
    "examples: uses the 2 reference example tiles and src/AI work dir",
    "mps: requires Apple MPS",
    "network: requires network access",
]

[tool.coverage.run]
source = ["fte"]
omit = ["fte/cli*.py", "fte/*/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
