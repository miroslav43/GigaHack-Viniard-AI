[project]
name = "vineyard-siret3"
version = "0.1.0"
description = "Sireț3 vineyard AI: pre-annotation, CVAT export, NN, waste, route and measurements"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "rasterio==1.5.1",
    "shapely==2.1.2",
    "geopandas==1.1.4",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
    "opencv-python-headless==4.14.0.94",
    "scikit-image==0.26.0",
    "scipy==1.18.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
nn = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "segmentation-models-pytorch==0.5.0",
]
waste-ml = [
    "transformers>=5.0",
    "open-clip-torch==3.3.0",
    "huggingface-hub>=0.34",
]
route = [
    "ortools==9.15.6755",
    "python-tsp==0.5.0",
    "sknw==0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
vineyard = "vineyard.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vineyard"]

[tool.uv]
# tsplib95 (via python-tsp) caps networkx<3 but only uses it for graph export, which we never call.
override-dependencies = ["networkx>=3.0"]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "needs_tiles: requires the 5 tile ZIPs under data & info/01_tiles",
    "slow: longer-running integration tests",
    "examples: uses the 2 reference example tiles",
    "mps: requires Apple MPS",
    "network: requires network access",
]

[tool.coverage.run]
source = ["vineyard"]
omit = ["vineyard/cli*.py", "vineyard/doctor.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
