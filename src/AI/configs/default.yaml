# Sireț3 vineyard AI — the single merged config (every key is required; the pydantic models hold no defaults).
# Sources: A = arhitectura/ARHITECTURA_Siret3.md v1.1 (wins), C = arhitectura/00_contracte.md, P = docs/design/00_PLAN.md,
# D1..D4 = docs/design/0{1,2,3,4}_*.md, X/I = critiques 05/06. Relative paths resolve against src/AI
# (the project root); paths.route_dir, paths.examples_dir and route.start_file resolve against paths.data_root.
# Env overrides: VINEYARD_DATA_ROOT, VINEYARD_WORK_DIR. CLI: --config <overlay.yaml> and --set a.b=<yaml value>.

contract_version: "1.1"

project:
  name: siret3
  crs: "EPSG:32635"

paths:
  data_root: "../../data & info"
  tiles_zip_glob: "01_tiles/siret3_challenge_tiles_part*of5.zip"   # relative to data_root
  route_dir: 02_route
  examples_dir: 05_examples/siret3_examples_cvat
  work_dir: work
  models_dir: models
  publish_dir: "../.."                     # repo root: route.geojson + measurements.csv (C§5)
  overrides: configs/overrides.yaml        # A§2.4, human QA edits
  waste_confirmed: configs/waste_confirmed.csv   # single key (was waste.review.confirmed_file)

grid:                                      # C§1.3 / §8; must equal geo.tiling constants
  gsd_m: 0.025
  tile_px: 2048
  tile_m: 51.2
  origin_x: 628992.0
  origin_y: 5221222.4
  expected_tiles: 311                      # also the import image count (was import.expected_images)
  tiepoint_tol_m: 1.0e-6

runtime:
  n_workers: 8                             # int or "auto" (= cpu_count - workers_auto_reserve)
  workers_auto_reserve: 3
  workers_sweep: [5, 8, 10]
  chunksize: 2
  maxtasksperchild: 100000                 # recycling workers hung the 311-tile pool after 100 tasks/worker
  seed: 0
  allow_failures: false
  thread_env:                              # documents vineyard._env.THREAD_ENV_DEFAULTS (A§4.1)
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
    GDAL_NUM_THREADS: "1"
    GDAL_CACHEMAX: "256"

nodata:                                    # C§1.7
  max_rgb: 10
  min_area_m2: 0.5
  close_px: 5
  dilate_px: 4
  veg_erode_px: 4
  min_valid_frac: 0.02
  approx_eps_px: 2.0

veg:                                       # D2 §4 (Lab a*: na = -(a*-128), blur, threshold)
  method: lab_a
  blur_sigma_px: 2.5
  threshold: 4.0
  morph_close_px: 0
  otsu_fallback_enabled: false             # P1
  otsu_fallback_veg_frac: [0.10, 0.90]
  shadow_v_max: 50                         # A§4.7, single key (X4)
  overexposed_v_min: 245
  texture_fallback:
    enabled: false                         # P1
    window_m: 0.25
    top_frac: 0.30
    trigger_min_veg_frac: 0.50

nn:                                        # D3 §4; disabled until after Publish (X4)
  enabled: false
  name: vine-unet
  version: v1
  arch: unet
  encoder: resnet18
  in_gsd_m: 0.05
  out_channels: 1
  axis_sigma_m: 0.15
  device: mps
  fallback_device: cpu
  batch_size: 8
  infer_batch_size: 4
  prob_threshold: 0.5
  weights_sha256: null
  weights_url: null
  fusion: A                                # A=veg∩corr, B=nn∩corr, C=veg∧nn∩corr, D=(veg∨nn)∩corr, E=nn only (ablation)
  use_in_rows: false
  use_in_interrow: false
  holdout_tiles: [siret3_r006_c004, siret3_r021_c012]
  mps_high_watermark_ratio: 0.8
  pseudolabels:
    ignore_band_px: 3                      # label px: veg this close OUTSIDE a corridor = ignore (overhang)
    edge_band_px: 1                        # label px ignored each side of the positive edges (3 left 60 % of vine as ignore)
    ignore_small_in_corridor: true
    ignore_clumps: true
    tree_filter: true                      # trees inside a corridor = ignore
    min_row_pieces: 3
    blocking_codes: [tile_failed, low_snr, orchard_rejected]
    fill_from_urgent: true                 # priority-1 tiles fill up to min_train_tiles
    min_labeled_frac: 0.05                 # skip patches with less labelled area
    train_tiles_file: null
    include_empty_tiles: true
    max_empty_tile_frac: 0.2
    min_train_tiles: 30
    patch_px: 512
    patch_stride_px: 512
  train:
    epochs: 20
    lr: 3.0e-4
    weight_decay: 0.01
    label_smoothing: 0.05
    patience: 3
    bce_weight: 1.0
    dice_weight: 1.0
    num_workers: 4
    colour_jitter: 0.10
    encoder_weights: imagenet
    smoke_max_batches: 50
    val_variant: B                         # early stopping on the official score of this fusion variant
    drop_noisy:
      enabled: false
      after_epoch: 5
      frac: 0.10
  ablation:
    variants: [A, B, C, D, E, F]
    promotable: [B, C, D]
    min_gain: 0.0
    axes_sources: [model, reference]
    panel_tiles: []
    n_auto_panels: 2

rows:                                      # D2 §4 (A names inside the C structure)
  detect:
    angle_step_deg: 0.5
    angle_coarse_step_deg: 2.0
    angle_bin_m: 0.1
    max_sample_points: 200000
    profile_bin_m: 0.05
    smooth_sigma_bins: 3
    spacing_estimate: autocorr
    spacing_min_m: 1.8                     # user decision: rows spacing gate 1.8-3.8 m
    spacing_max_m: 3.8
    peak_min_dist_factor: 0.6
    periodicity_min_snr: 3.0
    snr_band_m: [0.5, 10.0]
    onlattice_tol_factor: 0.25
    band_init_m: 0.45
    band_m: 0.35
    band_max_drift_m: 0.8
    min_band_area_m2: 0.2
    fit_iterations: 3
    angle_gate_deg: 3.0
    end_percentiles: [0.5, 99.5]
    snap_to_edge_m: 3.0
    min_row_len_m: 1.0
    residual_split_m: 0.15
    track_window_px: 256
    track_vertex_m: 7.5
    dp_tolerance_m: 0.1
    tracking_enabled: false                # P1
    max_orientations: 3
    multi_min_residual_frac: 0.15
    multi_min_angle_sep_deg: 10.0
    gap_record_min_m: 3.0
    mask_forbidden: true
    snr_peak_rel_width: 0.1                # spectral SNR: +-10% band around 1/s
    snap_ray_max_factor: 3.0               # edge snap ray <= this x snap_to_edge_m
    # tune-implement 2026-09-26: a tile with no accepted row retries from the angle with the most offset-
    # histogram power at the row frequencies (the variance argmax can follow a tree belt / sand edge:
    # r023_c014 and r007_c003 were missed). Kept only with >= min_rows accepted and more accepted length.
    angle_fallback_enabled: false             # adds false rows on >= 6 non-vine tiles at 311 (verify report)
    angle_fallback_min_rows: 3
  link:
    link_angle_max_deg: 3.0
    link_offset_max_m: 0.3
    link_gap_max_tiles: 1
    angle_min_len_m: 5.0
    passage_erode_m: 0.5
    dup_overlap_m: 0.5
    rescue_soft_rejects: true
    hole_support_min_frac: 0.5             # S4: neighbour rows must cover >= this of a hole
    refit_sample_m: 0.5
  filter:
    width_p80_max_m: 1.2
    width_station_m: 0.25
    occupancy_min: 0.15
    min_vine_score: 0.35                   # only when NN probabilities are present
    wide_min_rel_contrast: 0.1

orchard:
  width_spacing_ratio_max: 0.45
  along_period_m: [3.0, 6.0]
  along_duty_max: 0.60
  tree_blob_area_m2: 2.0
  tree_blob_axis_ratio_max: 1.5
  block_reject_enabled: false              # P1
  block_majority_frac: 0.5

# Neighbour-guided recovery (rows_link, before linking): a tile with <= target_max_accepted accepted rows
# is retried at the lattice (angle, spacing, UTM phase) of each 8-neighbour with >= prior_min_rows
# accepted rows. Only the angle +- angle_search_deg and the spacing +- spacing_rel_tol are searched, and
# only candidates on the extended lattice that continue a neighbour row across the tile edge, with real
# row structure (occupancy, rel_contrast, width, no orchard period) are added, so young vines on bare soil (no_periodicity / too_wide in the global pass)
# are recovered without the global gates. Priors come from rows_detect only (no propagation).
rows_guided:
  enabled: true
  target_max_accepted: 999                 # every tile (was 4: only near-empty tiles; partial blocks stayed partial)
  prior_min_rows: 5
  prior_angle_merge_deg: 5.0
  max_priors_per_cluster: 3                # neighbours at one angle may disagree on spacing/phase: best of 3
  angle_search_deg: 2.0
  angle_step_deg: 0.5
  spacing_rel_tol: 0.15
  min_snr: 3.0
  lattice_tol_frac: 0.25
  phase_tol_frac: 0.25
  occupancy_min: 0.3
  min_rel_contrast: 0.15
  width_p80_max_m: 1.4
  wide_min_rel_contrast: 0.5               # wide (weedy) rows kept only with a strong interrow density drop
  orchard_along_period_m: [3.3, 6.0]       # guided pass only; young vines have a 3.0-3.1 m plant period
  min_row_len_m: 5.0
  min_rows: 3
  min_sep_m: 1.0
  continue_max_m: 1.5                      # a guided row must continue a neighbour's accepted row (gap <= this)
  cut_gap_m: 3.0                           # guided rows end at empty runs >= this (road): only the continued piece
  # complete partial blocks (2026-09-26): every tile with a prior is retried (target_max_accepted above
  # was 4), its own lattice is a prior, and a row may also be anchored beside an accepted row of its tile.
  self_prior: true
  lateral_enabled: true
  lateral_max_factor: 1.3                  # x spacing: the next row of the block, never two rows away
  lateral_min_rows: 1
  rounds: 2                                # round 2 continues from the rows recovered in round 1

blocks:
  neighbour_max_m: 4.0
  parallel_max_deg: 5.0
  min_overlap_frac: 0.20
  collinear_gap_max_m: 5.0                 # also: chains split at unsupported holes >= this (P item 11)
  skip_one_enabled: true                   # P item 11: a missing row must not split a block
  skip_one_spacing_factor: [1.6, 2.3]      # edge when spacing in [1.6, 2.3] x local s -> missing_row_suspect
  spacing_cut_enabled: false               # r021 evidence (D2)
  spacing_jump_max_m: 0.2
  phase_tol_factor: 0.3
  headland_min_rows: 3
  transverse_band_min_m: 4.0
  transverse_full_width: true
  min_rows_per_block: 3                    # also derive's warning threshold (was derive.min_rows_per_block_warn)
  cut_by_passages: true
  outline_buffer_m: 2.5                    # C§2.5.6; also derive's outline (was derive.block_buffer_m)
  id_prefix: V
  id_width: 2
  row_id_width: 3
  garden_max_row_length_m: 300.0
  band_bin_m: 0.1                          # transverse-band histogram bin
  band_pad_m: 1.0
  spacing_cut_side_rows: 3
  too_few_rows_issue_min: 2
  override_match_tol_m: 1.0                # overrides.yaml entries: default `tol_m`

canopy:
  corridor_half_m: 0.30                    # single key for the 0.30 m corridor (I14: derive/targets read it)
  min_area_m2: 0.19                        # on the vector area (F5)
  connectivity: 8
  simplify_px: 2.0                         # P1-CAN sweep: 0.8459 vs 0.8405 at 2.5, area +2.1% / +0.5%
  vector_offset_px: 0.0                    # raw findContours convention (R1 / C3)
  vector_outset_px: 0.0
  clump_area_m2: 2.0
  split_clumps: false
  max_perp_width_tree_m: 1.5
  tree_filter_enabled: false               # P1
  rows_margin_m: 1.0
  corridor_label_convention: index         # raw contour vertices stay inside the 0.30 m corridor
  clip_to_corridor: false                  # S1: vector clip only for the eval sweep
  interpolated_min_veg_frac: 0.15          # S4: corridor veg evidence on row_interpolated tiles
  # tune-implement 2026-09-26: canopies come from ExG = 2G-R-B (absolute DN), not from the a* veg mask
  # (rows, interrow cover, visibility and waste keep a*). a* keeps the dark cast shadow (SW side) and misses
  # pale sunlit leaves (NE side); ExG after a sigma-2 px blur fixes both. Threshold 25 (~ ExG > 0.1 on RGB
  # in [0, 1]) with the axis refinement: canopy r006 0.852 -> 0.894, r021 0.762 -> 0.847 on viz42 rows,
  # canopy area bias +1.3% / -0.8% (24: +3.8% / +3.6%). "veg" = the tile_prep a* mask (previous behaviour).
  mask_method: exg
  exg_blur_sigma_px: 2.0
  exg_threshold: 25.0
  # local row pieces are moved sideways onto the ExG pixels of a +-band_m strip before the corridor labels
  # (mean offset, iters, capped, skipped under min_px pixels); the published rows are unchanged. a*-fitted
  # axes sit towards the shadow (r021: 4.3 cm, p90 11.7 cm). 0 = off.
  axis_refine_band_m: 0.35
  axis_refine_iters: 3
  axis_refine_max_m: 0.10
  axis_refine_min_px: 200
  # row_attrs only: corridor components >= this (and < min_area_m2) count as plants when measuring gaps;
  # they are never exported. 0 (or >= min_area_m2) = off. 51/51 reference labels for 0.10-0.13 (0.09 lets
  # weed blobs close real r006 gaps, 0.14 misses the faint plant of r021 R16).
  gap_evidence_min_area_m2: 0.11

interrow:
  offset_m: 0.30
  cover_bare_max: 0.25
  cover_veg_min: 0.75
  shadow_unassessable: 0.5
  min_width_assessable_m: 0.4
  cover_borderline_margin: 0.05
  hole_min_area_m2: 1.0
  hole_sources: [forbidden]
  edge_extend_m: 10.0                      # row ends on the data boundary are extended for the bands
  edge_tol_m: 0.05
  canopy_clearance_m: 0.01                 # gap kept when canopies are cut out of interrows (> 0.1 px export rounding)

row_structure:
  gap_disrupted_m: 5.0
  include_end_gaps: true
  borderline_m: [4.5, 7.0]
  unassessable_visible_min: 0.5
  occ_bin_m: 0.05
  occ_close_m: 0.4
  occ_window_m: 0.5
  occ_min: 0.20
  occ_smoothing_enabled: false             # S2: window+closing only for model canopies, re-validate 51/51 first
  gap_fill_max_width_m: 1.2
  visible_bin_max_hidden: 0.5

waste:                                     # D3 §4
  enabled: true
  min_area_m2: 0.015
  max_area_m2: 6.0
  white_min_area_m2: 0.03
  axis_exclusion_m: 0.6
  axis_exclusion_mode: all
  plant_phase_tol: 0.25
  lattice:
    pitch_range_m: [0.8, 2.0]
    min_points: 4
    bin_m: 0.05
  tube_max_aspect: 2.5
  tube_max_area_m2: 0.12
  hose_min_len_m: 3.0
  hose_max_width_m: 0.05
  nms_iou: 0.3
  box_pad: 0.10
  block_assign_max_m: 10.0                 # single 10 m rule (was export.cvat.waste_empty_vid_min_dist_m)
  max_candidates_total: 9999
  axis_margin_m: 1.0                       # design 03 W2: tile rows grown by 1 m
  colour:
    vivid_s_min: 150
    vivid_v_min: 70
    veg_hue_range: [25, 95]
    bright_v_min: 200
    bright_s_max: 45
    open_px: 1
    white_mean_s_max: 30                   # bright_soil rule: mean S >= this and hue in soil_hue_range
    soil_hue_range: [0, 35]
  decide:
    auto_accept_enabled: false             # nothing auto-exported before Publish; only waste_confirmed.csv
    candidate_min: 0.3
    auto_probe_min: 0.9
    auto_sam3_min: 0.5
    auto_clip_margin_min: 0.2
    rule_only_max_review: 300
    sam_rank_boost: 0.5                    # review rank only; auto-accept unaffected
  probe:
    enabled: true
    name: waste-probe
    version: v1
    clip_model: ViT-B-32
    clip_pretrained: laion2b_s34b_b79k
    device: mps
    embed_batch: 64
    crop_context: 0.5
    crop_min_px: 64
    crop_resize_px: 224
    lr_c: 1.0
    calibration_margin: 0.02
    min_recall: 0.2
    cv_folds: 5                            # grouped: tile ids (negatives), UAVVaste flight batches (positives)
    max_iter: 5000
    calibrate_on: all                      # tau* from all example negatives (conservative) | survivors
    positives:
      mode: both
      long_side_px: [8, 40]
      max_n: 1500
      jpeg_quality: 90
      paste_blur_sigma_px: 0.5
      zenodo_record: 8214061
      repo_url: https://github.com/PUTvision/UAVVaste
      licence: CC-BY-4.0                   # Zenodo record (the GitHub code is Apache-2.0)
      max_download_gb: 8.0
      assumed_object_m: 0.25
      min_objects_for_scale: 3
      max_per_image: 4
      target_blur_sigma_px: 0.8            # UAVVaste 4x sharper than Sireț3 at 2.5 cm/px
      background_tiles: 8
    negatives:
      random_per_tile: 200                 # example tiles
      other_reasons: [near_axis, periodic_tube, too_small_white, bright_soil, tube_shape, hose]
      max_per_other_tile: 20
      random_per_other_tile: 5
      random_box_px: [5, 40]
      max_random_attempts: 2000
    clip_pos_prompts: ["trash", "a plastic bag", "a plastic bottle", "a tire", "a heap of rubbish", "litter on the ground"]
    clip_neg_prompts: ["a white plastic vine tube", "a wooden stake", "a stone", "bare soil", "grass", "a grapevine",
                       "an irrigation hose", "a car"]
  sam3:
    enabled: false                         # ~15 s/crop on CPU: enabled only for the dedicated waste run
    model_ids: [facebook/sam3]             # 3.1 has no transformers weights (P facts)
    local_checkpoint: ../../models/sam3.1/sam3.1_multiplex.pt
    device: cpu
    crop_px: 512
    text_prompts: [trash, plastic bag, plastic bottle, tire, rubbish heap]
    prompt_categories:
      trash: debris
      plastic bag: bag
      plastic bottle: bottle
      tire: tyre
      rubbish heap: heap
    max_negative_boxes: 3
    threshold: 0.4
    mask_threshold: 0.5
    min_overlap_frac: 0.2
    time_budget_s: 1800.0
    min_probe_to_verify: 0.3
    max_mask_crop_frac: 0.25
    allow_download: false
    torch_threads: 0                       # 0 = all cores
  review:
    crop_px: 256
    confirm_match_iou: 0.5
    edge_tol_px: 1.0

qa:                                        # D2 §4
  preview_px: 1024
  preview_jpeg_quality: 85
  overview_px_per_tile: 128
  colors_bgr:
    row: [0, 0, 255]
    disrupted: [255, 0, 255]
    unassessable: [0, 165, 255]
    canopy: [0, 255, 0]
    interrow: [255, 255, 0]
    waste: [0, 255, 255]
    rejected: [128, 128, 128]
    tree: [255, 0, 0]
  canopy_fill_alpha: 0.35
  snr_review_max: 6.0

derive:                                    # D4 §4 (outline buffer, min rows and corridor come from blocks/canopy)
  join_lateral_max_m: 0.4
  row_missing_min_len_m: 0.5
  vertex_dedupe_m: 0.001
  blocks_merge_warn_m: 5.0
  interrow_link_max_m: 3.8
  garden_forbidden_dist_m: 20.0
  garden_max_rows: 15
  # Inter-row pieces of different blocks must not overlap, so the block areas add up to the survey total.
  # A cross-block overlap above interrow_overlap_min_m2 goes to the block with the most own canopy area within
  # interrow_overlap_support_m of the contested area (ties: lower vineyard_id); the other pieces are cut, and
  # parts below export.min_interrow_piece_m2 or nowhere interrow_overlap_min_width_m wide are dropped. The
  # width floor is above 2 x interrow.offset_m (0.6 m), the strip along a vine row that no inter-row covers:
  # a spurious row family crossing a block at a small angle keeps only such strips (r009_c002: 85, 121 m2).
  interrow_overlap_min_m2: 0.0001
  interrow_overlap_support_m: 1.0
  interrow_overlap_min_width_m: 0.8

targets:
  gap_min_m: 5.0
  long_gap_m: 20.0
  gap_step_m: 15.0
  gap_sample_step_m: 3.0
  missing_min_m: 2.0
  include_missing: true
  include_sparse: true
  sparse_window_m: 20.0
  sparse_step_m: 10.0
  sparse_occ_max: 0.10
  sparse_known_min: 0.9
  end_short_min_m: 5.0
  missing_row_spacing_factor: 1.8
  include_waste: true
  priority_long_gap_m: 10.0
  dedupe_m: 1.0
  # route_role: these kinds are must-visit, every other kind is optional (routed only when cheap,
  # route.solver.optional_max_detour_m). row_gap = interior gaps >= gap_min_m (one target per gap_step_m).
  must_kinds: [row_gap, missing_row, waste]
  # Row-derived targets (not waste) within this distance of the coverage boundary (tile_valid union:
  # tile edges and nodata) are dropped, and a row end this close is "on the boundary" (no row_end_short).
  # 3 m ~ one row spacing (2.3-3.0 m measured), so the outer neighbour of such a row may be unseen; it is
  # the largest value that keeps every organizer-annotated row gap of the example tiles (nearest: 3.25 m).
  edge_margin_m: 3.0
  end_skip_outer_rows: true                # no row_end_short on the first/last row of a block (one-sided)
  # row_end_short (b) needs two lateral neighbours, one per side, each at least this far across the row
  # (~0.6 x the 2.3-3.0 m row spacing): collinear fragments of one row (tile seams, 0-0.3 m apart) and
  # spurious rows inside an interrow (neighbours half a spacing away, 1.1-1.5 m on viz42) are no comparison.
  end_neighbour_min_offset_m: 1.5

route:                                     # D4 §4 (A§4.11 names)
  start_file: 02_route/start.geojson       # relative to data_root
  start_tolerance_m: 5.0
  visit_radius_m: 2.0
  candidate_radius_m: 1.9
  max_candidates_per_side: 3
  max_snap_m: 5.0
  max_outside_frac_official: 0.02         # organizers' elimination threshold (reference only)
  # Our single outside-share limit: publish refusal, route validator pass/fail, passable report and
  # (minus plan_outside_margin) the planner's policy acceptance and outside-budget trimming.
  max_outside_frac_publish: 0.015
  plan_outside_margin: 0.001               # the planner accepts a policy at <= 0.015 - 0.001
  walking_speed_kmh: 4.0
  domain:
    grid_size_m: 0.001
    inner_buffer_m: 0.05
    eroded_buffer_m: 0.3
    seam_close_m: 0.05
    subtract_canopies: true
  graph:
    centerline_step_m: 2.0
    centerline_min_len_m: 1.0
    skeleton_res_m: 0.25
    skeleton_erode_m: 0.3
    spur_min_m: 2.0
    simplify_tol_m: 0.25
    connector_max_m: 6.0
    connector_outside_penalty: 10.0
    snap_join_m: 0.5
    pull_lookahead: 200
    target_spur_standoff_m: 1.5
  solver:
    method: auto
    time_limit_s: 30
    time_limit_final_s: 60
    final: false                           # CLI --final / `vineyard final` sets true
    first_solution: PATH_CHEAPEST_ARC
    metaheuristic: GUIDED_LOCAL_SEARCH
    cost_per_m: 100
    cover_iterations: 3
    fallback_time_s: 20
    max_tsp_nodes: 1500
    merge_node_m: 1.0
    dijkstra_chunk: 256
    include_optional: true
    # An optional target is routed only when its cheapest insertion into the must tour costs at most
    # this much graph cost (metres + outside penalty); with no must target every optional one is routed.
    optional_max_detour_m: 25.0
    probe_time_limit_s: 5                  # per-policy probe solve (the chosen policy is re-solved in full)
    budget_rounds: 10                      # drop_* policies: re-solves while trimming outside length
  validate:
    coord_decimals: 2
    closure_max_m: 0.01
    length_tol_m: 0.01
    zero_len_eps_m: 0.005

export:
  min_row_piece_m: 0.5
  min_interrow_piece_m2: 0.25
  cvat:
    coord_decimals: 1
    shape_source: manual                   # user decision (X17)
    max_zip_bytes: 85000000
    n_parts: null                          # derived by greedy packing (5 measured)
    balance_parts: true
    zip_name: "siret3_upload_{i:02d}of{n:02d}.zip"
    verify_roundtrip: true
    min_polygon_px2: 16.0
    min_polyline_px: 4.0
    simplify_px: 0.5                       # never applied a second time to canopies (C2)
    notch_width_px: 1.0                    # >= 1 px so 0.1 px rounding cannot close it (C7)
    max_canopy_interrow_overlap_m2: 0.05   # checked after px conversion (C2)
    roundtrip_max_dev_px: 0.06
    selfcheck_min_union_iou: 0.98          # polygons and boxes
    selfcheck_max_row_dev_m: 0.02          # rows: Hausdorff; export simplify 0.5 px = 1.25 cm + 0.1 px rounding
    xml_deflate_level: 9
    manual_row_start: 900
    allow_qa_errors: false                 # CLI --allow-qa-errors
    invalid_tile_policy: block             # block | empty (export the bad tile empty, reason invalid)

import:
  files: []                                # CLI positional args of import-marcaj / from-marcaj / final
  accept_enum_synonyms: true
  duplicate_policy: last_wins
  require_all_tiles: true                  # CLI --partial sets false
  enum_synonyms:
    bare soil: bare_soil
    bare: bare_soil
    grass: vegetation
    veg: vegetation
    unknown: unassessable
  canopy_row_assign_max_m: 0.5
  min_line_length_m: 0.05
  accept_masks: true

measure:
  round_m: 0.01
  round_ha: 0.0001
  total_label: ALL
  area_union_sum_warn_frac: 0.001

publish:
  require_source: null                     # `make final` sets marcaj
  sum_check_tol_m: 0.05                    # block / row row_length_m sums vs the survey line
  sum_check_tol_m2: 0.05                   # block interrow_area_m2 sum vs the survey line (overlap-free pieces)

web:
  out_dir: ../Web/data
  survey_id: siret3                        # bundle dir surveys/<survey_id>/pipeline/ (e.g. siret3-nn1); web survey.id rule ^[a-z0-9][a-z0-9-]{1,39}$
  survey_name: Sireț3                      # 2-160 characters (web survey.name)
  geojson_decimals_4326: 7
  utm_decimals: 3
  ortho_mode: auto
  ortho_px: 512
  ortho_quality: 80
  canopy_minzoom: 18
  gdal2tiles:
    zoom: "14-20"
    resampling: average
    tiledriver: WEBP
    webp_quality: 75
    processes: 8
  canopy_mvt: auto
  utm_copies: true
  mask_px: 1024                            # masks/<tile>.png side; must divide grid.tile_px (any-vegetation max-pool)
  tile_review: configs/tile_review.csv     # tiles needing completion in Marcaj (tile_id,status,note); null = none

eval:
  example_tiles: [siret3_r006_c004, siret3_r021_c012]
  reference_annset: LATEST_REFERENCE
  canopy_match_iou: 0.5
  canopy_w_iou: 0.6
  canopy_w_f1: 0.4
  row_tol_m: 0.4
  row_min_cover: 0.8
  waste_match_iou: 0.3
  count_tol: 0.15
  length_tol: 0.10
  fp_canopy_factor: 0.5
  interrow_match_iou: 0.5
  regression_max_drop: 0.01
  enforce_gates: false                     # CLI --gates
  baseline_file: null                      # CLI --baseline
  write_baseline: false                    # CLI --write-baseline
  default_baseline_name: eval_baseline.json   # <work_dir>/<name> when --write-baseline has no --baseline
  gates:
    canopy_score: 0.80
    row_f1: 0.95
    interrow_iou: 0.95
    attributes: 0.90

logging:
  level: INFO
  jsonl: true
  console: rich
  tz: Europe/Chisinau
